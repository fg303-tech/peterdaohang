<script>
// 侧边菜单平滑滚动（原生交互）
$("a.smooth").click(function(e){
    e.preventDefault();
    let target = $(this).attr("href");
    $('html,body').animate({
        scrollTop: $(target).offset().top - 70
    }, 500);
    $("#main-menu li").removeClass("active");
    $(this).parents("li").addClass("active");
});
</script>
